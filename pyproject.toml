[project]
name = "text2sql"
version = "0.1.0"
description = "Quirky Analyst: a text-to-SQL agent for the Olist e-commerce data"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
